name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (PHP 8.2 / Laravel 12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgen-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, json, openssl, pdo, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: sgen-backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('sgen-backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Test Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Tests (PHPUnit / Pest)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
        run: php artisan test --ansi

      - name: Code Style Check (Laravel Pint)
        run: ./vendor/bin/pint --test

  frontend-build:
    name: Frontend Build & Type Validation (Vue 3 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgen-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sgen-backend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit Backend Dependencies
        working-directory: sgen-backend
        run: composer audit || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Frontend Dependencies
        working-directory: sgen-backend
        run: npm audit --audit-level=high || true
