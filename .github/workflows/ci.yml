name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: Backend (PHP 8.3 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: sgen
          POSTGRES_PASSWORD: sgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgen -d ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: sgen-backend

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ci_test
      DB_USERNAME: sgen
      DB_PASSWORD: sgen
      DB_DATABASE_TESTING: ci_test

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pgsql, pdo_pgsql, mbstring, bcmath, fileinfo
          coverage: pcov

      - name: Auditoría de dependencias PHP
        run: composer audit --no-interaction

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar aplicación
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar y provisionar RBAC en la BD de pruebas
        run: |
          php artisan migrate --force
          php artisan db:seed --class="Database\Seeders\RolesAndPermissionsSeeder" --force

      - name: Pint (estilo, sin modificar)
        run: vendor/bin/pint --test

      - name: Análisis estático (PHPStan nivel 6, baseline congelado)
        run: composer analyse

      - name: Suite de tests con reporte de cobertura
        run: php artisan test --coverage-text
        # TODO: una vez medida la cobertura real en CI, fijar umbral bloqueante (--min=X) y subirlo progresivamente.

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sgen-backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sgen-backend/package-lock.json

      - name: Instalar dependencias Node
        run: npm ci

      - name: Auditoría de dependencias Node (alta+crítica bloquea)
        run: npm audit --audit-level=high

      - name: Typecheck estricto (vue-tsc)
        run: npm run typecheck

      - name: Build de producción
        run: npm run build
